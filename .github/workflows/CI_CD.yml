name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x86_x64)
            os: windows-latest
            platform: windows
            artifact: FadeStripper-windows
            ext: zip

          - name: Linux
            os: ubuntu-22.04
            platform: posix
            cmake_args: ""
            artifact: FadeStripper-linux
            ext: tar.gz

          - name: macOS
            os: macos-latest
            platform: posix
            cmake_args: ""
            artifact: FadeStripper-macos
            ext: tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        shell: bash
        run: |
          if   [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y libfmt-dev
          elif [ "$RUNNER_OS" = "macOS" ]; then brew install fmt
          fi

      - name: Configure & Build Debug (Windows)
        if: matrix.platform == 'windows'
        run: |
          cmake -B build-x86 -A Win32
          cmake -B build-x64 -A x64
          cmake --build build-x86 --config Debug --parallel
          cmake --build build-x64 --config Debug --parallel

      - name: Build & Install Release (Windows)
        if: matrix.platform == 'windows'
        run: |
          cmake --build build-x86 --config Release --parallel
          cmake --build build-x64 --config Release --parallel
          cmake --install build-x86 --config Release --prefix dist
          cmake --install build-x64 --config Release --prefix dist/x64

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Configure & Build Debug (POSIX)
        if: matrix.platform == 'posix'
        run: |
          cmake -B build-dbg -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake_args }}
          cmake --build build-dbg --parallel

      - name: Configure, Build & Install Release (POSIX)
        if: matrix.platform == 'posix'
        run: |
          cmake -B build-rel -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}
          cmake --build build-rel --parallel
          cmake --install build-rel --config Release --strip --prefix dist

      - name: Package (POSIX)
        if: matrix.platform == 'posix'
        shell: bash
        run: tar -czf "${{ matrix.artifact }}.${{ matrix.ext }}" -C dist FadeStripper

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify artifacts
        run: ls -lh artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          name: FadeStripper ${{ github.ref_name }}
          draft: false
          make_latest: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz